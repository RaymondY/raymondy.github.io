# =============================================================================
# Site
# =============================================================================
locale:            "en-US"
title:             "Tiankai Yang"
title_separator:   "·"
name:              &name "Tiankai Yang"
description:       &description >-
  Tiankai Yang — CS PhD student at USC FORTIS Lab. Research on trustworthiness
  of large language models and agents: post-training alignment, robust LLM
  inference (hallucination, jailbreak, OOD), and trustworthy agentic systems.
url:               "https://raymondy.github.io"
baseurl:           ""
repository:        "RaymondY/raymondy.github.io"
timezone:          America/Los_Angeles

# =============================================================================
# Author (rendered in the sidebar profile)
# =============================================================================
author:
  name:        *name                          # canonical, used for paper-author matching
  display_name: "Tiankai (Raymond) Yang"      # shown in hero title and sidebar
  avatar:      "profile.webp"
  bio:         "CS PhD @ USC FORTIS Lab"
  role:        "PhD Student, Computer Science"
  location:    "Los Angeles, CA"
  employer:    "University of Southern California"
  lab:         "FORTIS Lab"
  lablink:     "https://viterbi-web.usc.edu/~yzhao010/lab.html"
  email:       "tiankaiy@usc.edu"

# =============================================================================
# ClustrMaps visitor globe (leave empty to disable)
# Find your ID at https://clustrmaps.com after creating a globe widget.
# =============================================================================
clustrmaps_id:     "1S_YnnrIKF4hpXnNFDcOZHkoW69xz06QSLvtcv98u34"

# =============================================================================
# Open Graph / social card
# =============================================================================
og_image:          "/images/profile-og.webp"
twitter:
  username:        ""

# =============================================================================
# Analytics (set provider + tracking_id to enable)
# =============================================================================
analytics:
  provider:        false   # boolean false disables; set "google-analytics-4" to enable
  google:
    tracking_id:   ""

# =============================================================================
# Build
# =============================================================================
markdown:          kramdown
highlighter:       rouge
encoding:          utf-8
markdown_ext:      "markdown,mkdown,mkdn,mkd,md"

kramdown:
  input:           GFM
  hard_wrap:       false
  auto_ids:        true
  toc_levels:      1..6
  smart_quotes:    lsquo,rsquo,ldquo,rdquo

sass:
  sass_dir:        _sass
  style:           compressed

permalink:         /:title/

include:
  - .htaccess
  - _pages
  - files

exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-cache
  - .sass-cache
  - CHANGELOG
  - Dockerfile
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - log
  - node_modules
  - package.json*
  - README.md
  - CONTRIBUTING.md
  - tmp
  - vendor
  - talkmap.ipynb
  - talkmap.py
  - markdown_generator

keep_files:
  - .git

# =============================================================================
# Collections (only what we use)
# =============================================================================
collections:
  publications:
    output: false   # data-driven via _data/papers.yml; no per-paper pages needed

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: page

# =============================================================================
# Plugins (kept compatible with GitHub Pages)
# =============================================================================
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from

# =============================================================================
# HTML compression
# =============================================================================
compress_html:
  clippings: all
  ignore:
    envs: development
