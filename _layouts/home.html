---
layout: default
---
<div class="page">
  {% include sidebar.html %}

  <article class="page__main">
    <section class="hero">
      <p class="hero__greeting">Hi, I'm</p>
      <h1 class="hero__title">{{ site.author.display_name | default: site.author.name }}</h1>
      <div class="hero__lede">{{ content }}</div>
    </section>

    {%- if site.data.news and site.data.news.size > 0 %}
    <section class="section">
      <h2 class="section__title">News</h2>
      {% include news.html limit=5 %}
    </section>
    {%- endif %}
  </article>
</div>
